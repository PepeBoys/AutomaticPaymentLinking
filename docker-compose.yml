services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: automaticpaymentlinking_app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APL_PUBLIC_PORT:-8000}:${APL_PORT:-8000}"
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./logs:/app/logs
