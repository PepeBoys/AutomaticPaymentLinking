<!-- path: src/templates/base.html -->
<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ page_title or "Автоматическая привязка платежей" }}</title>
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0,
                   maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <!-- External libs -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/Selectivity.js/2.1.0/selectivity-full.min.css">

    <!-- IMPORTANT:
         url_for('static', ...) may generate http://... behind a tunnel/proxy,
         which becomes Mixed Content and gets blocked inside HTTPS iframe.
         Use relative paths so the browser keeps the current https origin.
    -->
    <link rel="stylesheet" href="/static/ms_uikit/css/uikit.css">

    <style>
        .link-settings {
            opacity: 1;
            transition: opacity 0.2s ease;
        }

        .js-auto-link-toggle:not(:checked) ~ * .link-settings {
            opacity: 0.5;
            pointer-events: none;
        }

        .native-select {
            appearance: auto;
            -webkit-appearance: menulist;
            -moz-appearance: menulist;
        }

        .settings-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 20px;
            margin-top: 16px;
        }

        .settings-section {
            margin-bottom: 24px;
        }

        .settings-section:last-child {
            margin-bottom: 0;
        }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-container {
            display: inline-flex;
            align-items: center;
            margin-left: 20px;
            min-height: 20px;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            vertical-align: middle;
            opacity: 0;
            transition: opacity 0.2s;
            flex-shrink: 0;
        }

        .status-indicator.visible {
            opacity: 1;
        }

        .status-indicator.saving {
            width: 14px;
            height: 14px;
            border: 2px solid #e5e7eb;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            background: transparent;
        }

        .status-indicator.saved {
            background: #10b981;
            animation: scaleIn 0.3s ease-out;
        }

        .status-text {
            font-size: 11px;
            color: #6b7280;
            margin-left: 6px;
            opacity: 0;
            transition: opacity 0.2s;
            white-space: nowrap;
        }

        .status-text.visible {
            opacity: 1;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes scaleIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>

<div class="page">
    {% block content %}{% endblock %}
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Selectivity.js/2.1.0/selectivity-full.min.js"></script>

<!-- Same Mixed Content fix for JS -->
<script src="/static/ms_uikit/js/uikit.js"></script>

<!-- Auto-expand iframe inside MoySklad -->
<script
  type="text/javascript"
  src="https://apps-api.moysklad.ru/js/ns/appstore/app/v1/moysklad-iframe-expand-3.js">
</script>

</body>
</html>
